        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name (same public package as API)
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$REPO_LOWERCASE" >> $GITHUB_ENV

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      # Same public package: ghcr.io/garletz/gafam:sandbox
      - name: Extract metadata for sandbox tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.image_name }}
          tags: |
            type=raw,value=sandbox,enable={{is_default_branch}}
            type=sha,prefix=sandbox-

      - name: Build and push sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./vpc-relay
          file: ./vpc-relay/Dockerfile.sandbox
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gafam-sandbox
          cache-to: type=gha,mode=max,scope=gafam-sandbox

  build-and-push-chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
