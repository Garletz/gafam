name: Build and Publish Backend Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vpc-relay/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'vpc-relay/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name for Docker image
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$REPO_LOWERCASE" >> $GITHUB_ENV

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./vpc-relay
          file: ./vpc-relay/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha,scope=gafam-api
          cache-to: type=gha,mode=max,scope=gafam-api

  build-and-push-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase browser image name
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "browser_image=${OWNER_LOWER}/gafam-browser" >> $GITHUB_ENV

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata for browser image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.browser_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push browser image
        uses: docker/build-push-action@v5
        with:
          context: ./vpc-relay
          file: ./vpc-relay/Dockerfile.browser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gafam-browser
          cache-to: type=gha,mode=max,scope=gafam-browser

      - name: Make browser package public (same as gafam-api)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Match public visibility of ghcr.io/garletz/gafam so VPS can pull without auth.
          for path in \
            "/user/packages/container/gafam-browser/visibility" \
            "/users/${{ github.repository_owner }}/packages/container/gafam-browser/visibility"
          do
            if gh api --method PUT "$path" -f visibility=public; then
              echo "Published via $path"
              exit 0
            fi
          done
          echo "Could not set visibility automatically — set Package → Change visibility → Public in GitHub UI."
          exit 0
